version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    container_name: db-postgres
    environment:
      POSTGRES_USER: giluser
      POSTGRES_PASSWORD: gilpass
      POSTGRES_DB: categorydb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giluser -d categorydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    container_name: category-backend1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/categorydb
      SPRING_DATASOURCE_USERNAME: giluser
      SPRING_DATASOURCE_PASSWORD: gilpass
    ports:
      - "8080:8080"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend/category-frontend
    container_name: category-frontend1
    depends_on:
      - backend
    ports:
      - "4200:4200"
    environment:
      API_URL: http://backend:8080/api
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
